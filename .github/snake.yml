name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

jobs:
  snake:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Arthurne

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=6A0DAD&color_dots=6A0DAD,9B59B6,C77DFF,FFFFFF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=6A0DAD&color_dots=6A0DAD,9B59B6,C77DFF,FFFFFF

      - name: Deploy Snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
